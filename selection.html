<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAMA APP STORE</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #030f0a, #071a12, #020604);
            color: #00ff88;
            font-family: 'Tahoma', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(10, 20, 15, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 255, 136, 0.25);
            padding: 25px 20px;
            border-radius: 24px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
        }
        h1 { font-size: 22px; color: #fff; margin-bottom: 8px; text-shadow: 0 0 10px rgba(0, 255, 136, 0.4); }
        .channel-name { color: #00ff88; font-size: 14px; font-weight: bold; margin-bottom: 15px; }
        .desc { font-size: 13px; color: #9ab; line-height: 1.6; margin-bottom: 20px; }

        /* دوگمەکانی سەرەوە (ئەندرۆید و ئایفۆن) */
        .grid-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .action-btn {
            background: rgba(20, 30, 25, 0.9);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: white;
            padding: 12px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: 0.3s;
        }
        .action-btn:hover {
            background: rgba(0, 255, 136, 0.15);
            border-color: #00ff88;
        }
        .android-btn {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            color: #fff;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.3);
        }
        .ios-btn {
            background: linear-gradient(135deg, #252525, #111111);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* کارتی پۆبچی و فایلەکان کە بەرەو خوارەوە دەچن */
        .app-card {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 12px;
            text-align: center;
        }
        .app-title { font-size: 14px; color: #fff; margin-bottom: 12px; font-weight: bold; }
        .download-btn {
            display: block;
            background: linear-gradient(135deg, #0072ff, #00c6ff);
            color: #fff;
            padding: 10px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>HAMA APP STORE</h1>
        <div class="channel-name">HAMA⚡️ViP</div>
        <p class="desc">تاکە سایتی هاکی پەیجی بێ هیچ ڕیکلامێک، وە دەتوانن هەموو چەناڵەکانی تلیگرام بەکاری بهێنن هیچ کێشەیەکەمان نییە.</p>

        <!-- دوگمەکانی ئەندرۆید و ئایفۆن لە سەرەوە -->
        <div class="grid-btns">
            <a href="android.html" class="action-btn android-btn">🤖 ئەندرۆید</a>
            <a href="iphone.html" class="action-btn ios-btn">📱 ئایفۆن</a>
        </div>

        <!-- کارتی پۆبچی لە خوارەوە -->
        <div class="app-card">
            <div class="app-title">✅ Pubg GL Safe Hack</div>
            <a href="android.html" class="download-btn">📥 داگرتن (کراوەیە)</a>
        </div>
    </div>

</body>
</html>
