<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAMA APP STORE</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #030f0a, #071a12, #020604);
            color: #00ff88;
            font-family: 'Tahoma', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(10, 20, 15, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 255, 136, 0.25);
            padding: 40px 20px;
            border-radius: 24px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
        }
        h1 { font-size: 22px; color: #fff; margin-bottom: 10px; text-shadow: 0 0 10px rgba(0, 255, 136, 0.4); }
        .channel-name { color: #00ff88; font-size: 15px; font-weight: bold; margin-bottom: 20px; }
        p { font-size: 13px; color: #9ab; line-height: 1.6; margin-bottom: 30px; }

        /* دوگمەکانی ئەندرۆید و ئایفۆن */
        .grid-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .action-btn {
            background: rgba(20, 30, 25, 0.9);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: white;
            padding: 18px 10px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.3s;
        }
        .action-btn:hover {
            background: rgba(0, 255, 136, 0.15);
            border-color: #00ff88;
            transform: translateY(-2px);
        }
        .android-btn {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            color: #fff;
            box-shadow: 0 5px 15px rgba(0, 114, 255, 0.3);
        }
        .ios-btn {
            background: linear-gradient(135deg, #252525, #111111);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>HAMA APP STORE</h1>
        <div class="channel-name">HAMA⚡️ViP</div>
        <p>تکایە سیستەمی مۆبایلەکەت هەڵبژێرە بۆ بەردەوام بوون:</p>

        <!-- دوگمەکان -->
        <div class="grid-btns">
            <a href="android.html" class="action-btn android-btn">🤖 ئەندرۆید</a>
            <a href="iphone.html" class="action-btn ios-btn">📱 ئایفۆن</a>
        </div>
    </div>

</body>
</html>
