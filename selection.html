<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAMA APP STORE</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #030f0a, #071a12, #020604);
            color: #00ff88;
            font-family: 'Tahoma', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .container {
            background: rgba(10, 20, 15, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 255, 136, 0.2);
            padding: 30px 20px;
            border-radius: 24px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }
        h1 { font-size: 20px; color: #fff; margin-bottom: 10px; }
        .desc { font-size: 13px; color: #9ab; line-height: 1.6; margin-bottom: 25px; }
        
        .grid-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .action-btn {
            background: rgba(20, 30, 25, 0.8);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: white;
            padding: 14px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }
        .action-btn:hover { background: rgba(0, 255, 136, 0.1); }
        .full-width { grid-column: span 2; }
        
        .app-card {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 18px;
            padding: 15px;
            margin-top: 20px;
        }
        .app-title { font-size: 15px; color: #fff; margin-bottom: 10px; }
        .download-btn {
            display: block;
            background: linear-gradient(135deg, #0072ff, #00c6ff);
            color: #fff;
            padding: 12px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>HAMA APP STORE</h1>
        <p class="desc">تاکە سایتی هاکی پەیجی بێ هیچ ڕیکلامێک، بەکاری بهێنن هیچ کێشەیەکەمان نییە.</p>

        <div class="grid-btns">
            <a href="iphone.html" class="action-btn">📱 ئایفۆن</a>
            <a href="android.html" class="action-btn">🤖 ئەندرۆید</a>
        </div>

        <div class="app-card">
            <div class="app-title">✅ Pubg GL Safe Hack</div>
            <a href="android.html" class="download-btn">📥 داگرتن</a>
        </div>
    </div>

</body>
</html>
