<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAMA APP STORE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #050505, #111111);
            color: #00ff66;
            font-family: 'Tahoma', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 102, 0.3);
            padding: 40px 25px;
            border-radius: 20px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 0 35px rgba(0, 255, 102, 0.2);
            text-align: center;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 15px;
            color: #fff;
            text-shadow: 0 0 15px rgba(0, 255, 102, 0.6);
            line-height: 1.6;
        }
        .channel-name {
            color: #00ff66;
            font-size: 18px;
            font-weight: bold;
            display: inline-block;
            margin: 10px 0 20px 0;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
        }
        p {
            font-size: 15px;
            color: #ccc;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .next-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #00ff66, #00aa44);
            color: #050505;
            padding: 16px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 14px;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0, 255, 102, 0.3);
        }
        .next-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 255, 102, 0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>بەخێربێیت بۆ وێپسایت HAMA APP STORE</h1>
        <p>ئەم وێپ سایتە دروستکراوی چەناڵی</p>
        <div class="channel-name">HAMA⚡️ViP</div>
        <p>بۆ بەردەوام بوون کلیک لەم شتەی خوارەوەیە 👇🏼</p>

        <!-- دوگمەی تێپەڕین بۆ بەشەکانی ئەندرۆید و ئایفۆن -->
        <a href="selection.html" class="next-btn">دەسم لێدە بۆ بەردەوام بون..</a>
    </div>

</body>
</html>
