<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAMA APP STORE - Android</title>
    <style>
        body {
            background: #090909;
            color: #00ff66;
            font-family: Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .box {
            background: rgba(20, 20, 20, 0.9);
            border: 1px solid rgba(0, 255, 102, 0.3);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
        }
        h2 { color: #fff; margin-bottom: 10px; }
        p { color: #aaa; font-size: 14px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>بەشی ئەندرۆید (Android)</h2>
        <p>ئەم بەشە تایبەتە بە بەرنامە و یارییەکانی ئەندرۆید.<br>زانیاری و فایلەکان لێرە بە زوویی دەنوسرێن!</p>
    </div>
</body>
</html>
