<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAMA APP STORE - iPhone</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #030f0a, #071a12, #020604);
            color: #00ff88;
            font-family: 'Tahoma', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(10, 20, 15, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 255, 136, 0.25);
            padding: 25px 20px;
            border-radius: 24px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
        }
        h1 { font-size: 20px; color: #fff; margin-bottom: 8px; text-shadow: 0 0 10px rgba(0, 255, 136, 0.4); }
        .channel-name { color: #00ff88; font-size: 14px; font-weight: bold; margin-bottom: 20px; }

        /* دوگمەکانی سەرەوە */
        .grid-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 25px;
        }
        .action-btn {
            background: rgba(20, 30, 25, 0.9);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: white;
            padding: 12px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: 0.3s;
        }
        .action-btn:hover {
            background: rgba(0, 255, 136, 0.15);
            border-color: #00ff88;
        }
        /* دیاریکردنی بەشی چالاک (ئایفۆن) */
        .active-ios {
            background: linear-gradient(135deg, #333333, #000000);
            border: 1px solid #fff;
            color: #fff;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }
        .inactive-android {
            background: rgba(20, 30, 25, 0.7);
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        /* بەشی کارتەکانی خوارەوە */
        .app-card {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 12px;
            text-align: center;
        }
        .app-title { font-size: 14px; color: #fff; margin-bottom: 12px; font-weight: bold; }
        .download-btn {
            display: block;
            background: linear-gradient(135deg, #555555, #222222);
            color: #fff;
            padding: 10px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            border: 1px solid #fff;
        }
        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: #9ab;
            font-size: 12px;
            text-decoration: none;
        }
        .back-link:hover { color: #00ff88; }
    </style>
</head>
<body>

    <div class="container">
        <h1>📱 بەشی ئایفۆن</h1>
        <div class="channel-name">HAMA⚡️ViP</div>

        <!-- دوگمەکانی سەرەوە بۆ گۆڕین -->
        <div class="grid-btns">
            <a href="android.html" class="action-btn inactive-android">🤖 ئەندرۆید</a>
            <a href="iphone.html" class="action-btn active-ios">📱 ئایفۆن</a>
        </div>

        <!-- کارتەکانی هاک و فایلەکان -->
        <div class="app-card">
            <div class="app-title">✅ iPhone Safe Hack</div>
            <a href="#" class="download-btn">📥 داگرتن (کراوەیە)</a>
        </div>

        <a href="selection.html" class="back-link">← گەڕانەوە بۆ سەرەتا</a>
    </div>

</body>
</html>
